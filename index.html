<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>9hows | European Lead Generation & Channel Development</title>
    <meta name="description" content="Founder-led European lead generation and channel development for B2B manufacturers and specialist product companies.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top" aria-label="9hows home">
        <img src="assets/logo-9hows.png" alt="9hows logo">
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="#what-we-do">What we do</a>
        <a href="#fit">Who we help</a>
        <a href="#founder">Founder</a>
        <a href="#team">Team</a>
        <a href="#offers">Offers</a>
      </nav>
      <a class="header-cta" data-content="cta.secondaryLabel" data-href="cta.secondaryHref" href="#contact">Book a call</a>
    </header>

    <main id="top">
      <section class="hero section">
        <div class="hero-copy">
          <p class="eyebrow" data-content="hero.eyebrow"></p>
          <h1 data-content="hero.headline"></h1>
          <p class="lead" data-content="hero.subheadline"></p>
          <div class="actions">
            <a class="button primary" data-content="cta.primaryLabel" data-href="cta.primaryHref" href="#contact"></a>
            <a class="button secondary" data-content="cta.secondaryLabel" data-href="cta.secondaryHref" href="#contact"></a>
          </div>
        </div>
        <div class="hero-panel" aria-label="European market development focus">
          <div class="hero-logo-wrap">
            <img class="hero-logo" src="assets/logo-9hows.png" alt="9hows">
          </div>
          <p data-content="hero.panelText"></p>
          <div class="market-card">
            <span>Direct buyers</span>
            <span>Distributors</span>
            <span>Importers</span>
            <span>Partners</span>
          </div>
          <div class="hero-metrics" aria-label="9hows focus">
            <span>90-day sprint</span>
            <span>Founder-led</span>
            <span>Europe-wide</span>
          </div>
        </div>
      </section>

      <section class="section split" id="problem">
        <div>
          <p class="eyebrow" data-content="problem.eyebrow"></p>
          <h2 data-content="problem.title"></h2>
          <p data-content="problem.text"></p>
        </div>
        <ul class="check-list" data-list="problem.bullets"></ul>
      </section>

      <section class="section blue-band" id="what-we-do">
        <div class="section-heading">
          <p class="eyebrow" data-content="whatWeDo.eyebrow"></p>
          <h2 data-content="whatWeDo.title"></h2>
        </div>
        <div class="pill-grid" data-list="whatWeDo.bullets"></div>
      </section>

      <section class="section" id="fit">
        <div class="section-heading">
          <p class="eyebrow" data-content="fit.eyebrow"></p>
          <h2 data-content="fit.title"></h2>
        </div>
        <div class="fit-grid">
          <div class="fit-column good">
            <h3 data-content="fit.goodTitle"></h3>
            <ul data-list="fit.goodFits"></ul>
          </div>
          <div class="fit-column less">
            <h3 data-content="fit.lessTitle"></h3>
            <ul data-list="fit.lessGoodFits"></ul>
          </div>
        </div>
      </section>

      <section class="section" id="process">
        <div class="section-heading">
          <p class="eyebrow" data-content="process.eyebrow"></p>
          <h2 data-content="process.title"></h2>
        </div>
        <div class="steps" data-steps="process.steps"></div>
      </section>

      <section class="section founder-band" id="founder">
        <div class="founder-photo">
          <img src="assets/founder-marcel.png" alt="Founder of 9hows">
          <div class="founder-caption">
            <strong data-content="founder.name"></strong>
            <span data-content="founder.role"></span>
          </div>
        </div>
        <div class="founder-copy">
          <p class="eyebrow" data-content="founder.eyebrow"></p>
          <h2 data-content="founder.title"></h2>
          <div data-paragraphs="founder.paragraphs"></div>
          <h3 data-content="founder.focusTitle"></h3>
          <div class="pill-grid compact" data-list="founder.focusAreas"></div>
        </div>
      </section>

      <section class="section team-section" id="team">
        <div class="section-heading">
          <p class="eyebrow" data-content="team.eyebrow"></p>
          <h2 data-content="team.title"></h2>
          <p data-content="team.text"></p>
        </div>
        <div class="team-grid" data-team="team.members"></div>
      </section>

      <section class="section" id="offers">
        <div class="section-heading">
          <p class="eyebrow" data-content="offers.eyebrow"></p>
          <h2 data-content="offers.title"></h2>
        </div>
        <div class="offer-grid" data-offers="offers.items"></div>
      </section>

      <section class="section blog-section" id="insights" hidden>
        <div class="section-heading">
          <p class="eyebrow">Insights</p>
          <h2>Latest notes</h2>
        </div>
        <div class="blog-grid" id="blog-posts"></div>
      </section>

      <section class="section final-cta" id="contact">
        <h2 data-content="finalCta.title"></h2>
        <p data-content="finalCta.text"></p>
        <div class="actions">
          <a class="button primary" data-content="finalCta.buttonLabel" data-href="finalCta.buttonHref" href="#contact"></a>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div>
        <img src="assets/logo-9hows.png" alt="9hows logo">
        <p data-content="footer.text"></p>
      </div>
      <address data-content="footer.address"></address>
      <p class="copyright" data-content="footer.copyright"></p>
    </footer>

    <script src="content/site-content.js"></script>
    <script src="content/blog-posts.js"></script>
    <script src="script.js"></script>
  </body>
</html>
